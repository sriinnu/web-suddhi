<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Alert gradient - red/orange tones -->
    <linearGradient id="alertGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Subtle inner glow gradient -->
    <linearGradient id="alertInnerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Shadow filter for depth -->
    <filter id="alertDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c2410c" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main shield shape with shadow -->
  <path
    d="M64 6
       C64 6 18 24 18 24
       L18 54
       C18 90 40 114 64 122
       C88 114 110 90 110 54
       L110 24
       C110 24 64 6 64 6 Z"
    fill="url(#alertGradient)"
    filter="url(#alertDropShadow)"/>

  <!-- Inner highlight for 3D effect -->
  <path
    d="M64 14
       C64 14 26 30 26 30
       L26 54
       C26 84 44 106 64 113
       C84 106 102 84 102 54
       L102 30
       C102 30 64 14 64 14 Z"
    fill="url(#alertInnerGlow)"/>

  <!-- Exclamation mark - bar -->
  <rect
    x="56"
    y="36"
    width="16"
    height="42"
    rx="6"
    ry="6"
    fill="#ffffff"/>

  <!-- Exclamation mark - dot -->
  <circle
    cx="64"
    cy="94"
    r="9"
    fill="#ffffff"/>

  <!-- Subtle top edge highlight -->
  <path
    d="M64 10 L24 27"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.5"
    stroke-opacity="0.4"
    stroke-linecap="round"/>

  <path
    d="M64 10 L104 27"
    fill="none"
    stroke="#c2410c"
    stroke-width="1"
    stroke-opacity="0.3"
    stroke-linecap="round"/>
</svg>
