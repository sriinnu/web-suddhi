<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Primary gradient - modern cyan to blue -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="40%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Subtle inner glow gradient -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Shadow filter for depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0369a1" flood-opacity="0.3"/>
    </filter>

    <!-- Subtle inner shadow -->
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="table" tableValues="1 0"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="2"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feFlood flood-color="#0369a1" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main shield shape with shadow -->
  <path
    d="M64 6
       C64 6 18 24 18 24
       L18 54
       C18 90 40 114 64 122
       C88 114 110 90 110 54
       L110 24
       C110 24 64 6 64 6 Z"
    fill="url(#shieldGradient)"
    filter="url(#dropShadow)"/>

  <!-- Inner highlight for 3D effect -->
  <path
    d="M64 14
       C64 14 26 30 26 30
       L26 54
       C26 84 44 106 64 113
       C84 106 102 84 102 54
       L102 30
       C102 30 64 14 64 14 Z"
    fill="url(#innerGlow)"/>

  <!-- Checkmark - clean and bold -->
  <g filter="url(#innerShadow)">
    <path
      d="M42 64 L56 78 L86 48"
      fill="none"
      stroke="#ffffff"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"/>
  </g>

  <!-- Subtle top edge highlight -->
  <path
    d="M64 10 L24 27"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.5"
    stroke-opacity="0.4"
    stroke-linecap="round"/>

  <path
    d="M64 10 L104 27"
    fill="none"
    stroke="#0369a1"
    stroke-width="1"
    stroke-opacity="0.3"
    stroke-linecap="round"/>
</svg>
