<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Primary gradient - modern cyan to blue -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="40%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Subtle inner glow gradient -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Shadow filter for depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0369a1" flood-opacity="0.3"/>
    </filter>

    <!-- Subtle inner shadow -->
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="table" tableValues="1 0"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#0369a1" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main shield shape with shadow -->
  <path
    d="M128 12
       C128 12 36 48 36 48
       L36 108
       C36 180 80 228 128 244
       C176 228 220 180 220 108
       L220 48
       C220 48 128 12 128 12 Z"
    fill="url(#shieldGradient)"
    filter="url(#dropShadow)"/>

  <!-- Inner highlight for 3D effect -->
  <path
    d="M128 28
       C128 28 52 60 52 60
       L52 108
       C52 168 88 212 128 226
       C168 212 204 168 204 108
       L204 60
       C204 60 128 28 128 28 Z"
    fill="url(#innerGlow)"/>

  <!-- Checkmark - clean and bold -->
  <g filter="url(#innerShadow)">
    <path
      d="M84 128 L112 156 L172 96"
      fill="none"
      stroke="#ffffff"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"/>
  </g>

  <!-- Subtle top edge highlight -->
  <path
    d="M128 20 L48 54"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    stroke-opacity="0.4"
    stroke-linecap="round"/>

  <path
    d="M128 20 L208 54"
    fill="none"
    stroke="#0369a1"
    stroke-width="2"
    stroke-opacity="0.3"
    stroke-linecap="round"/>
</svg>
