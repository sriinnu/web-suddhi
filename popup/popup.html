<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSuddhi</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrapper">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <img src="../icons/icon48.png" alt="WebSuddhi" class="logo">
      </div>
      <div class="header-content">
        <h1>WebSuddhi</h1>
        <span class="tagline">Clean web, clear mind</span>
      </div>
      <div class="header-right">
        <span class="status-badge" id="statusBadge">
          <span class="status-dot"></span>
          Active
        </span>
      </div>
    </header>

    <main class="main-content">
      <!-- Protection Toggle -->
      <section class="card protection-card">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="card-body">
          <h2>Protection</h2>
          <p>Block ads, trackers, and annoyances</p>
        </div>
        <label class="toggle">
          <input type="checkbox" id="enableToggle" checked>
          <span class="toggle-track">
            <span class="toggle-thumb"></span>
          </span>
        </label>
      </section>

      <!-- Current Site -->
      <section class="card site-card">
        <div class="site-info">
          <span class="site-label">Current Website</span>
          <span class="site-domain" id="currentSite">loading...</span>
        </div>
        <div class="site-actions">
          <button class="btn btn-secondary" id="whitelistBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Allow
          </button>
          <button class="btn btn-danger" id="blacklistBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
            Block
          </button>
        </div>
      </section>

      <!-- Stats -->
      <section class="card stats-card">
        <div class="stats-grid">
          <div class="stat" id="networkStatBtn" style="cursor: pointer;">
            <span class="stat-value" id="networkBlockedCount">0</span>
            <span class="stat-label">Network</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat" id="cosmeticStatBtn" style="cursor: pointer;">
            <span class="stat-value" id="cosmeticBlockedCount">0</span>
            <span class="stat-label">Cosmetic</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat">
            <span class="stat-value" id="rulesCount">0</span>
            <span class="stat-label">Rules</span>
          </div>
        </div>
        <div class="stats-footer">
          <span class="stat-sub" id="dataSaved">0 KB saved</span>
          <a href="#" class="view-all" id="viewAllBlocked">View All</a>
        </div>
      </section>

      <!-- Features -->
      <section class="features-section">
        <h3 class="section-title">Blocking Features</h3>
        <div class="features-grid">
          <label class="feature-item">
            <input type="checkbox" id="networkBlockingToggle" checked>
            <div class="feature-card">
              <div class="feature-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
                  <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
                  <circle cx="12" cy="12" r="10"/>
                </svg>
              </div>
              <div class="feature-text">
                <span class="feature-name">Network</span>
                <span class="feature-desc">Block ads & trackers</span>
              </div>
              <span class="feature-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
            </div>
          </label>

          <label class="feature-item">
            <input type="checkbox" id="urlCleaningToggle" checked>
            <div class="feature-card">
              <div class="feature-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
              </div>
              <div class="feature-text">
                <span class="feature-name">URL Clean</span>
                <span class="feature-desc">Remove tracking params</span>
              </div>
              <span class="feature-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
            </div>
          </label>

          <label class="feature-item">
            <input type="checkbox" id="cookieConsentToggle" checked>
            <div class="feature-card">
              <div class="feature-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <circle cx="8" cy="10" r="1" fill="currentColor"/>
                  <circle cx="15" cy="8" r="1" fill="currentColor"/>
                  <circle cx="10" cy="15" r="1" fill="currentColor"/>
                  <circle cx="16" cy="14" r="1" fill="currentColor"/>
                </svg>
              </div>
              <div class="feature-text">
                <span class="feature-name">Cookies</span>
                <span class="feature-desc">Block consent popups</span>
              </div>
              <span class="feature-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
            </div>
          </label>

          <label class="feature-item">
            <input type="checkbox" id="annoyanceToggle" checked>
            <div class="feature-card">
              <div class="feature-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
                </svg>
              </div>
              <div class="feature-text">
                <span class="feature-name">Annoyances</span>
                <span class="feature-desc">Hide popups & banners</span>
              </div>
              <span class="feature-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
            </div>
          </label>

          <label class="feature-item">
            <input type="checkbox" id="paywallToggle" checked>
            <div class="feature-card">
              <div class="feature-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </div>
              <div class="feature-text">
                <span class="feature-name">Paywall</span>
                <span class="feature-desc">Remove paywalls</span>
              </div>
              <span class="feature-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
            </div>
          </label>

          <button class="action-item" id="removePaywallBtn" style="width: 100%; margin-top: 8px;">
            <div class="action-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
              </svg>
            </div>
            <span class="action-label">Try Remove Paywall</span>
          </button>
        </div>
      </section>

      <!-- Quick Actions -->
      <section class="actions-section">
        <h3 class="section-title">Quick Actions</h3>
        <div class="actions-grid">
          <button class="action-item" id="pickModeBtn">
            <div class="action-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M7 2l12 11.5-5.5 1.2 3.3 6.8-2.2 1-3.2-7L7 20V2z"/>
              </svg>
            </div>
            <span class="action-label">Pick Element</span>
          </button>
          <button class="action-item" id="zapModeBtn">
            <div class="action-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
              </svg>
            </div>
            <span class="action-label">Quick Zap</span>
          </button>
          <button class="action-item" id="whitelistToggleBtn">
            <div class="action-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 12l2 2 4-4"/>
                <circle cx="12" cy="12" r="10"/>
              </svg>
            </div>
            <span class="action-label" id="whitelistBtnText">Whitelist</span>
          </button>
          <button class="action-item" id="openOptionsBtn">
            <div class="action-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </div>
            <span class="action-label">Settings</span>
          </button>
        </div>
      </section>

      <!-- Blocked Panel (hidden by default) -->
      <div class="blocked-panel" id="blockedPanel" style="display: none;">
        <div class="blocked-header">
          <h3 id="blockedTitle">Blocked</h3>
          <button class="blocked-close" id="blockedClose">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="blocked-list" id="blockedList"></div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span class="version">WebSuddhi 2.1.0</span>
      <a href="https://github.com/sriinnu/web-suddhi/issues" class="link" id="reportIssue">Report Issue</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
