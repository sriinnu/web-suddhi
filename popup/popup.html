<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSuddhi</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <img src="../icons/icon48.png" alt="WebSuddhi" class="logo">
      <div class="header-text">
        <h1>WebSuddhi</h1>
        <span class="tagline">Clean web, clear mind</span>
      </div>
    </header>

    <div class="status-section">
      <label class="toggle-switch">
        <input type="checkbox" id="enableToggle" checked>
        <span class="slider"></span>
        <span class="label-text">Protection</span>
      </label>
    </div>

    <div class="site-info-section" id="siteInfoSection">
      <div class="site-header">
        <div class="site-icon" id="siteIcon">
          <!-- Secure lock icon (default) -->
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-secure" aria-label="Secure connection" role="img">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <!-- Insecure warning icon (hidden by default) -->
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-insecure" style="display:none;" aria-label="Insecure connection" role="img">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
        <div class="site-details">
          <span class="site-label">You're visiting</span>
          <span class="current-site" id="currentSite">loading...</span>
        </div>
        <div class="site-mascot" id="siteMascot">
          <!-- Fun mascot that reacts to security status -->
          <svg viewBox="0 0 40 40" width="36" height="36" class="mascot-happy">
            <circle cx="20" cy="20" r="18" fill="#10b981" opacity="0.2"/>
            <circle cx="20" cy="20" r="15" fill="#10b981" opacity="0.3"/>
            <circle cx="14" cy="16" r="2.5" fill="#10b981"/>
            <circle cx="26" cy="16" r="2.5" fill="#10b981"/>
            <path d="M12 24 Q20 30 28 24" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          </svg>
          <svg viewBox="0 0 40 40" width="36" height="36" class="mascot-worried" style="display:none;">
            <circle cx="20" cy="20" r="18" fill="#f59e0b" opacity="0.2"/>
            <circle cx="20" cy="20" r="15" fill="#f59e0b" opacity="0.3"/>
            <circle cx="14" cy="16" r="2.5" fill="#f59e0b"/>
            <circle cx="26" cy="16" r="2.5" fill="#f59e0b"/>
            <path d="M12 26 Q20 22 28 26" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <div class="security-info" id="securityInfo">
        <div class="security-badge secure" id="securityBadge" role="status" aria-live="polite">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
          <span id="securityText">Secure Connection</span>
        </div>
        <div class="cert-info" id="certInfo">
          <span class="cert-detail" id="certProtocol">HTTPS</span>
          <span class="cert-separator">•</span>
          <span class="cert-detail" id="certType">TLS Encrypted</span>
        </div>
      </div>

      <!-- Certificate Owner Info -->
      <div class="cert-owner-section" id="certOwnerSection" style="display: none;">
        <div class="cert-owner-header">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span>Certificate Owner</span>
        </div>
        <div class="cert-owner-name" id="certOwnerName">Loading...</div>
        <div class="cert-owner-details" id="certOwnerDetails"></div>
      </div>

      <!-- Third-Party Frames Section -->
      <div class="frames-section" id="framesSection" style="display: none;">
        <div class="frames-header">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="9" y1="21" x2="9" y2="9"/>
          </svg>
          <span>Embedded Content</span>
          <span class="frames-count" id="framesCount">0</span>
        </div>
        <div class="frames-list" id="framesList"></div>
      </div>

      <div class="site-controls">
        <label class="toggle-switch small">
          <input type="checkbox" id="whitelistToggle">
          <span class="slider"></span>
          <span class="label-text small">Disable protection on this site</span>
        </label>
      </div>
    </div>

    <div class="js-section">
      <label class="toggle-switch small">
        <input type="checkbox" id="jsToggle">
        <span class="slider"></span>
        <span class="label-text small">Disable JavaScript on this site</span>
      </label>
      <span class="js-hint" id="jsHint"></span>
    </div>

    <div class="paywall-section">
      <label class="toggle-switch">
        <input type="checkbox" id="paywallToggle" checked>
        <span class="slider"></span>
        <span class="label-text">Remove Paywalls</span>
      </label>
    </div>

    <div class="features-section">
      <label class="toggle-switch small">
        <input type="checkbox" id="networkBlockingToggle" checked>
        <span class="slider"></span>
        <span class="label-text small">Network Blocking</span>
      </label>
      <label class="toggle-switch small">
        <input type="checkbox" id="urlCleaningToggle" checked>
        <span class="slider"></span>
        <span class="label-text small">URL Cleaning</span>
      </label>
      <label class="toggle-switch small">
        <input type="checkbox" id="cookieConsentToggle" checked>
        <span class="slider"></span>
        <span class="label-text small">Cookie Auto-Dismiss</span>
      </label>
      <label class="toggle-switch small">
        <input type="checkbox" id="annoyanceToggle" checked>
        <span class="slider"></span>
        <span class="label-text small">Annoyance Blocker</span>
      </label>
    </div>

    <div class="stats-section">
      <div class="stat clickable" id="networkStatBtn" title="Click to view blocked requests">
        <span class="stat-value" id="networkBlockedCount">0</span>
        <span class="stat-label">Network</span>
      </div>
      <div class="stat clickable" id="cosmeticStatBtn" title="Click to view blocked elements">
        <span class="stat-value" id="cosmeticBlockedCount">0</span>
        <span class="stat-label">Cosmetic</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="rulesCount">0</span>
        <span class="stat-label">Rules</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="dataSaved">0 MB</span>
        <span class="stat-label">Data Saved</span>
      </div>
    </div>

    <!-- Blocked Items Panel (hidden by default) -->
    <div class="blocked-panel" id="blockedPanel" style="display: none;">
      <div class="blocked-header">
        <span class="blocked-title" id="blockedTitle">Blocked Requests</span>
        <button class="blocked-close" id="blockedClose">&times;</button>
      </div>
      <div class="blocked-list" id="blockedList">
        <div class="blocked-empty">No items blocked yet</div>
      </div>
      <div class="blocked-actions">
        <button class="blocked-view-all" id="viewAllBlocked">View All in Options</button>
      </div>
    </div>

    <div class="tracker-summary" id="trackerSummary" style="display: none;">
      <div class="tracker-title">Blocked Trackers</div>
      <div class="tracker-categories" id="trackerCategories"></div>
    </div>

    <div class="actions-section">
      <button id="removePaywallBtn" class="action-btn paywall-btn" aria-label="Remove paywall from current page">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
        </svg>
        Remove Paywall Now
      </button>

      <button id="pickModeBtn" class="action-btn pick-btn" aria-label="Pick an element to block">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8"/>
          <line x1="12" y1="2" x2="12" y2="6"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="6" y2="12"/>
          <line x1="18" y1="12" x2="22" y2="12"/>
        </svg>
        Pick Element to Block
      </button>

      <button id="zapModeBtn" class="action-btn zap-btn" aria-label="Temporarily hide an element">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        Zap Element (Quick Hide)
      </button>

      <button id="openOptionsBtn" class="action-btn options-btn" aria-label="Open settings page">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="21" x2="4" y2="14"/>
          <line x1="4" y1="10" x2="4" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12" y2="3"/>
          <line x1="20" y1="21" x2="20" y2="16"/>
          <line x1="20" y1="12" x2="20" y2="3"/>
          <line x1="1" y1="14" x2="7" y2="14"/>
          <line x1="9" y1="8" x2="15" y2="8"/>
          <line x1="17" y1="16" x2="23" y2="16"/>
        </svg>
        Manage Rules
      </button>
    </div>

    <div class="footer">
      <span class="version">v2.1.0</span>
      <a href="https://github.com/sriinnu/web-suddhi/issues" id="reportIssue">Report Issue</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
